PLP Python Week 7 — Lists

list_warmup.py — Demonstrates creating a list, accessing items by index, using .append(), .remove(), and len().

shopping_list.py — Provides an interactive shopping list manager using a loop, .append(), .remove(), and the in operator.

list_report.py — Prints a numbered list, counts item names with more than four letters, and finds the longest item name using a loop.

It is safer to check if an item is in a list before calling .remove() because .remove() causes an error if the item does not exist. Using in first prevents the program from crashing and allows us to give the user a helpful message instead.
